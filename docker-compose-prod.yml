  # --- jovemaprendiz ---
  jovemaprendiz_backend:
    build: ../sisinove-jovemaprendiz/backend
    restart: always
    env_file: ../sisinove-jovemaprendiz/.env
    volumes:
      - ../sisinove-jovemaprendiz/backend:/app
      - /app/node_modules
      - ../sisinove-jovemaprendiz/backend/uploads:/app/uploads:Z
    environment:
      # Trocamos 'db' por 'host.docker.internal' e mantemos a porta 5434
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@sisinove_shared_db:5432/sisinove_jovemaprendiz?schema=public
      PORT: 4003
      DB_HOST: host.docker.internal
      DB_PORT: 5434
    ports:
      - "127.0.0.1:4003:4003"
    # Esta linha é necessária para que o container entenda o que é 'host.docker.internal' no Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sisinove_shared_net # Nome da rede que o sisinove_shared_db usa

  jovemaprendiz_frontend:
    image: node:20-alpine
    restart: always
    working_dir: /app
    volumes:
      - ../sisinove-jovemaprendiz/frontend:/app
      - /app/node_modules
    environment:
      - VITE_JOVEMAPRENDIZ_API_URL=/api
    ports:
      - "127.0.0.1:8083:5173"
    command: sh -c "npm install && npm run dev -- --host --port 5173"

volumes:
  postgres_data:

networks:
  sisinove_shared_net:
    external: true
    name: sisinove-diplomas_default
